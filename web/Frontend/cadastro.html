<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal IFCE Eventos</title>
    <!-- Ajuste o caminho do CSS conforme a sua pasta -->
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
    <!-- =========================
         CABEÇALHO
    ========================== -->
    <header class="topo">
        <div class="logo-area">
            <div class="logo">
                <img src="assets/logot.png" alt="Logo IFCE">
            </div>
            <span>Portal IFCE Eventos</span>
        </div>
    </header>

    <!-- =========================
         ÁREA DE CADASTRO
    ========================== -->
    <main class="cadastro">
        <div class="fundo"></div>
        <div class="conteudo">
            <!-- SETA -->
            <a href="#" class="voltar">‹</a>

            <!-- TÍTULO -->
            <h1>Cadastre-se</h1>

            <!-- ADICIONADO ID AQUI -->
            <form id="formCadastro">
                <div class="formulario">

                    <!-- COLUNA ESQUERDA -->
                    <div class="lado-esquerdo">
                        <div class="campo">
                            <label for="nome">Nome Completo</label>
                            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                        </div>

                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="Digite seu E-mail" required>
                        </div>

                        <div class="campo">
                            <label for="matricula">Matrícula do Siape</label>
                            <input type="text" id="matricula" name="matricula" placeholder="Digite sua matrícula do siape" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" required>
                        </div>
                    </div>

                    <!-- COLUNA DIREITA -->
                    <div class="lado-direito">
                        <div class="campo">
                            <label for="ocultar_senha">Senha</label>
                            <div class="senha-container">
                                <input type="password" id="ocultar_senha" name="senha" placeholder="Digite sua senha" required>
                                <button type="button" class="mostrar-senha" id="mostrar-senha" aria-label="Mostrar senha">◉</button>
                            </div>
                        </div>

                        <div class="campo"> 
                            <label for="confirmar">Confirmar senha</label>
                            <div class="senha-container">
                                <input type="password" id="confirmar" name="confirmar" placeholder="Digite sua senha novamente" required>
                                <button type="button" class="mostrar-senha" id="mostrar-confirmar" aria-label="Mostrar senha">◉</button>
                            </div>
                        </div>

                        <div class="campo_data">
                            <label>Data de Nascimento</label>
                            <div class="data-container">
                                <input type="text" id="dia" name="dia" placeholder="DD" inputmode="numeric" maxlength="2" pattern="[0-9]{2}" required>
                                <input type="text" id="mes" name="mes" placeholder="MM" inputmode="numeric" maxlength="2" pattern="[0-9]{2}" required>
                                <input type="text" id="ano" name="ano" placeholder="YYYY" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required> 
                            </div>
                        </div>
                    </div>
                </div>

                <!-- BOTÃO -->
                <div class="botao-container">
                    <button type="submit" class="btn-entrar">Entrar</button>
                </div>
            </form>
        </div>
    </main>

    <!-- SCRIPTS SEPARADOS -->
    <script src="js/backendcadastro.js"></script>
    <script src="js/scriptcadastro.js"></script>
</body>
</html>
