<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>teste cadastro</title>
</head>
<body>
    <h1>Cadastro</h1>
    <input type="text" placeholder="Usuário" id="usuario">
    <input type="text" placeholder="Email" id="email">
    <select name="generos" id="generos">
        <option value="M" id="M">Masculino</option>
        <option value="F" id="F">Feminino</option>
        <option value="O" id="O">Outro</option>
    </select>
    <input type="password" placeholder="Senha" id="senha">
    <input type="password" placeholder="Confirmar Senha" id="confirmar-senha">

    <input type="button" value="Enviar" id="enviar">
</body>
<script src="/server/scriptCadastro.js"></script>
</html>
